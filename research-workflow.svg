<svg xmlns="http://www.w3.org/2000/svg" width="800" height="280" viewBox="0 0 800 280" role="img" aria-labelledby="title description">
<title id="title">Calibrate predictions for three outcomes</title>
<desc id="description">Stack and calibrate diet-only models using NHANES 24-hour dietary recalls. Test fixed thresholds for hypertension, the primary outcome, and for type 2 diabetes and thyroid disorder, the secondary outcomes.</desc>
<style>
text{font-family:Arial,Helvetica,sans-serif}.label{fill:#145c55;font-size:12px;font-weight:700;letter-spacing:1px}.heading{fill:#132c3a;font-size:30px;font-weight:700}.card{fill:#132c3a;font-size:15px;font-weight:700}.body{fill:#304d5a;font-size:14px}
</style>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#347c76"/></marker></defs>
<rect x="1" y="1" width="798" height="278" rx="17" fill="#f3f8f8" stroke="#afc9c7"/>
<text x="32" y="37" class="label">NHANES  /  MULTI-OUTCOME PREDICTION</text>
<text x="32" y="77" class="heading">Calibrate predictions for three outcomes</text>
<g fill="none" stroke="#347c76" stroke-width="2" marker-end="url(#arrow)"><path d="M261 180H282"/><path d="M515 180H536"/></g>
<g transform="translate(32 113)">
<rect width="228" height="134" rx="12" fill="#dcefeb" stroke="#afc9c7"/>
<text x="16" y="25" class="label">01 / INPUTS</text>
<text x="16" y="51" class="card">24-hour dietary recalls</text>
<text x="16" y="75" class="body">NHANES dietary features</text>
</g>
<g transform="translate(286 113)">
<rect width="228" height="134" rx="12" fill="#fff" stroke="#afc9c7"/>
<text x="16" y="25" class="label">02 / MODELLING</text>
<text x="16" y="51" class="card">Stack and calibrate</text>
<text x="16" y="75" class="body">Combine neural network</text>
<text x="16" y="93" class="body">predictions by outcome</text>
</g>
<g transform="translate(540 113)">
<rect width="228" height="134" rx="12" fill="#fff" stroke="#afc9c7"/>
<text x="16" y="25" class="label">03 / EVALUATION</text>
<text x="16" y="51" class="card">Test fixed thresholds</text>
<text x="16" y="75" class="body">Primary · Hypertension</text>
<text x="16" y="93" class="body">Secondary · Type 2 diabetes</text>
<text x="16" y="111" class="body">and thyroid disorder</text>
</g>
</svg>
